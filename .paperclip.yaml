  onboarding:
    status: "in_progress"
    workspaces:
      fbruandrade-ach360:
        name: "fbruandrade/ach360"
        metadata:
          githubRepositoryId: "1403775757"
        isPrimary: true
        repoUrl: "https://github.com/fbruandrade/ach360"
        sourceType: "git_repo"
        visibility: "default"
schemaVersion: 7
